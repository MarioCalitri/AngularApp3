<div class="auth-card">
  <h2>Login</h2>

  <form (ngSubmit)="onLogin()">
    <div class="form-group">
      <label for="userName">Username</label>
      <input
        id="userName"
        name="userName"
        type="text"
        [(ngModel)]="userName"
        required
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="submit" class="btn-primary" [disabled]="submitting || isLockedOut">
        {{ isLockedOut ? 'Locked Out' : (submitting ? 'Logging in...' : 'Login') }}
    </button>  </form>

   @if (error) {
    <p class="error-msg">
        {{ error }}
        @if (isLockedOut) {
        <span class="attempts-left">Try again in <strong>{{ lockoutSeconds }}s</strong>.</span>
        } @else {
        <span class="attempts-left">
            (<strong>{{ attemptsRemaining }}</strong> {{ attemptsRemaining === 1 ? 'attempt' : 'attempts' }} remaining)
        </span>
        }
    </p>
    }
    <p class="auth-switch">Need an account? <a routerLink="/register">Register</a></p>
    </div>
