<div class="container mt-4">
  <h2>Add Book</h2>

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  @if (success) {
    <div class="alert alert-success">{{ success }}</div>
  }

  <form #f="ngForm" (ngSubmit)="addBook(f)">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" id="title" name="title" class="form-control"
             [(ngModel)]="book.title" required />
    </div>

    <div class="mb-3">
      <label for="author" class="form-label">Author</label>
      <input type="text" id="author" name="author" class="form-control"
             [(ngModel)]="book.author" required />
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <input type="text" id="description" name="description" class="form-control"
             [(ngModel)]="book.description" required />
    </div>

 <div class="form-group">
      <label>Book Image</label>
      @if (previewUrl) {
        <div class="image-preview-container">
          <img [src]="previewUrl" alt="Cover Preview" class="preview-img" />
        </div>
      }
      <input type="file" name="image" class="form-control" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <button type="submit" class="btn btn-primary me-2" [disabled]="f.invalid">Add Contact</button>
    <button type="button" class="btn btn-secondary" routerLink="/contacts">Cancel</button>
  </form>
</div>
