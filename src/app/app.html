<nav class="navbar">
  <div class="nav-links">
    @if (!auth.currentUser()) {
<a routerLink="/register">REGISTER</a>
      <a routerLink="/login">LOGIN</a>     
      
    }
  </div>

  @if (auth.currentUser()) {
    <div class="user-status">
      <span>Logged in as: <strong>{{ auth.currentUser() }}</strong></span>
      <button type="button" class="btn-logout" (click)="onLogout()">Logout</button>
    </div>
  }
</nav>
