<div class="container">
  <div class="toolbar">
    <h2>Update Book</h2>
  </div>

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  @if (success) {
    <div class="alert alert-success">{{ success }}</div>
  }

  <form #f="ngForm" (ngSubmit)="updateBook()">
    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" class="form-control" [(ngModel)]="book.title" required maxlength="255" />
    </div>

    <div class="form-group">
      <label>Author</label>
      <input type="text" name="author" class="form-control" [(ngModel)]="book.author" required maxlength="255" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-control" [(ngModel)]="book.description"></textarea>
    </div>

    <div class="form-group">
      <label>Cover Image</label>
      @if (previewUrl) {
        <div class="image-preview-container mb-2">
          <img [src]="previewUrl" alt="Cover Preview" class="preview-img" />
        </div>
      }
      <input type="file" name="image" class="form-control" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <div class="form-group">
      <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Update Book</button>
      <button type="button" class="btn btn-secondary" routerLink="/list">Cancel</button>
    </div>
  </form>
</div>
